<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Screenilux">
  <!-- Two screens overlapping at a corner, joined by the live recording dot:
       every screen, recorded together, in step. -->
  <defs>
    <mask id="gap">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="32" cy="32" r="10.5" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#gap)">
    <rect x="3" y="7" width="40" height="29" rx="8" fill="#07beb8"/>
    <rect x="21" y="28" width="40" height="29" rx="8" fill="#012625"/>
  </g>
  <circle cx="32" cy="32" r="6.5" fill="#069a95"/>
</svg>
